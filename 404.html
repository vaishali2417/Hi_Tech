<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="shortcut icon" href="http://localhost/ascolite/images/favicon.png" type="image/png">

    <style>
        .html,
        body {
            height: 100%;
            width: 100%;
            background-color: rebeccapurple;
            margin: 0;
            padding: 0;
        }

        .mainClass {
            height: 100vh;
            /* 100% of the viewport height */
            width: 100%;
            background-color: red;
        }

        .navDiv {
            height: 74px;
            width: 100%;
            background-color: #75983E;
            display: flex;
            justify-content: start;
            align-items: center;
        }

        .restArea {
            height: calc(100vh - 74px);
            /* Remaining height */
            width: 100%;
            background-color: white;
            display: flex;
            justify-content: start;
            align-items: center;
            flex-direction: column;
            color: white;
        }

        
    </style>
    <title>404 Not Found</title>
</head>

<body>

    <div class="mainClass">
        <div class="navDiv">
            <img class="pl-3" src="http://localhost/ascolite/images/svg/logo.svg" alt="">
        </div>
        <!-- <div class="restArea">
            <h2>OOps!</h2>
            <h1>404 Not Found..</h1>
        </div> -->
        <div class="restArea">
            <h1 style="height: min-content;width:min-content;color:#011f4b;font-size: 200px;margin-top: 30px;">404</h1>
            <h1 style="height: min-content;width:min-content;color:#011f4b;font-size: 20px;white-space: nowrap;">Sorry, the page you are looking for does not exist.</h1>
            <p></p>
            <button type="button" class="btn " style="background-color: #75983E;"><a style="color: #011f4b;" href="/" class="home-btn">Go Back Home</a></button>
            
        </div>
    </div>


    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
</body>

</html>
